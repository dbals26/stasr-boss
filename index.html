<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1220"><meta name="description" content="스타서버 보스 출현 현황 실시간 대시보드">
<title>스타서버 보스 현황</title>
<style>
:root{color-scheme:dark;--bg:#0b1220;--panel:#141e31;--line:#2c3b52;--text:#e7edf7;--muted:#9aaac2;--gold:#f5c668;--green:#62e0a5;--red:#ff8f89}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 70% 0%,#172945,var(--bg) 54%);color:var(--text);font-family:system-ui,-apple-system,"Malgun Gothic",sans-serif;min-height:100vh}main{max-width:1100px;margin:auto;padding:28px 18px 64px}header{display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap}h1{font-size:clamp(24px,4vw,34px);margin:5px 0 4px;letter-spacing:-.7px}.eyebrow{font-size:12px;font-weight:800;letter-spacing:2px;color:var(--gold)}.sub{color:var(--muted);font-size:13px;margin:0}button,select,input{font:inherit}button{background:#24354c;border:1px solid #3b506e;color:white;padding:10px 14px;border-radius:10px;cursor:pointer}button:hover{background:#314767}.statusbar{margin:24px 0;display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;color:var(--muted);font-size:13px}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--muted);margin-right:5px}.dot.ok{background:var(--green)}.dot.bad{background:var(--red)}.counts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.count{border:1px solid var(--line);border-radius:14px;background:var(--panel);padding:18px}.count strong{display:block;font-size:30px;margin-top:6px}.count small{color:var(--muted)}.toolbar{margin:22px 0 14px;display:flex;gap:10px;flex-wrap:wrap}.toolbar input,.toolbar select{background:#17243a;border:1px solid #34445a;color:white;border-radius:10px;padding:11px 12px;min-height:43px}.toolbar input{flex:1;min-width:170px}.toolbar select{min-width:120px}.grid{display:flex;flex-direction:column;gap:3px}.boss-table-head{display:grid;grid-template-columns:minmax(130px,2fr) 85px 112px 104px 75px;gap:8px;padding:9px 12px;color:var(--muted);font-size:12px;font-weight:700}.boss{display:grid;grid-template-columns:minmax(130px,2fr) 85px 112px 104px 75px;gap:8px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:8px 12px;min-width:0}.boss.live-row{border-left:4px solid var(--green);background:#13352f}.boss h2{font-size:14px;margin:0;word-break:keep-all}.boss-name{min-width:0}.boss-name small{display:block;color:var(--muted);font-size:10px;margin-top:3px}.boss .timer{font-size:16px;margin:0}.boss .chip{justify-self:start}.boss .next-time,.boss .cycle{font-size:12px;color:var(--muted)}.count{padding:12px!important}.count strong{font-size:25px!important;margin-top:2px!important}.statusbar{margin:12px 0!important}.toolbar{margin:14px 0 10px!important}.boss .timer.active{color:var(--green)}.boss{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:17px;min-width:0}.boss h2{font-size:17px;margin:0;word-break:keep-all}.boss-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}.chip{padding:4px 8px;border-radius:7px;white-space:nowrap;font-size:11px;background:#30415a;color:#d1e1f5}.chip.live{background:#124b3b;color:#83f0bd}.chip.wait{background:#3b3346;color:#e2c5ef}.chip.dead{background:#573039;color:#ffc3bb}.meta{font-size:12px;color:var(--muted);margin:6px 0 17px}.timer{font-weight:800;letter-spacing:.2px;font-size:25px;font-variant-numeric:tabular-nums;color:var(--gold);margin:4px 0}.time-label{font-size:12px;color:var(--muted)}.time-row{margin-top:10px;display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:12px;gap:8px}.empty{border:1px dashed var(--line);border-radius:15px;padding:36px;text-align:center;color:var(--muted)}.error{background:#48262c;border:1px solid #8c4249;color:#ffd6d0;padding:12px;border-radius:10px;margin:16px 0}footer{font-size:12px;color:var(--muted);margin-top:28px;line-height:1.7}@media(max-width:650px){main{padding:12px 8px 35px}h1{font-size:23px}.counts{gap:6px}.toolbar{gap:5px}.toolbar input{min-width:100%;flex:auto}.toolbar select{flex:1;min-width:0;font-size:12px}.boss-table-head{grid-template-columns:minmax(0,1.3fr) 65px 80px;gap:5px;padding:5px 7px;font-size:11px}.boss-table-head span:nth-child(4),.boss-table-head span:nth-child(5){display:none}.boss{grid-template-columns:minmax(0,1.3fr) 65px 80px;gap:5px;padding:8px 7px}.boss h2{font-size:13px}.boss .timer{font-size:14px}.boss .next-time,.boss .cycle{display:none}.chip{font-size:10px;padding:4px 5px}header button{padding:7px;font-size:12px}.count small{font-size:11px}.count strong{font-size:23px!important}}
</style>
</head>
<body><main>
<header><div><div class="eyebrow">STAR SERVER</div><h1>보스 출현 현황</h1><p class="sub">실시간 정보 · PC / 모바일 지원</p></div><button id="reload" type="button">↻ 지금 새로고침</button></header>
<div class="statusbar"><span><span id="dot" class="dot"></span><span id="connection">연결 중...</span></span><span id="updated">최근 확인: -</span></div>
<section class="counts" aria-label="보스 현황 요약"><div class="count"><small>전체 보스</small><strong id="total">-</strong></div><div class="count"><small>출현 중</small><strong id="liveCount">-</strong></div><div class="count"><small>대기 / 기타</small><strong id="waitingCount">-</strong></div></section>
<div class="toolbar"><input id="search" placeholder="보스 이름 검색" aria-label="보스 이름 검색"><select id="filter" aria-label="상태 필터"><option value="all">전체 상태</option><option value="live">출현 중</option><option value="waiting">대기 중</option><option value="other">기타</option></select><select id="sort" aria-label="정렬"><option value="soon">다음 출현순</option><option value="name">이름순</option><option value="status">출현 중 우선</option></select></div>
<div id="error" class="error" role="alert" hidden></div><div class="boss-table-head"><span>보스 이름</span><span>상태</span><span>남은 시간</span><span>출현 예정</span><span>주기</span></div><section id="bosses" class="grid" aria-live="polite"><div class="empty">보스 정보를 불러오는 중입니다...</div></section>
<footer>원본 데이터: starserver.online · 자동 갱신 15초마다 · 시간은 한국시간(KST) 기준<br>비공식 개인 제작 현황판입니다. 원본 서버 또는 API가 응답하지 않으면 정보가 갱신되지 않을 수 있습니다.</footer>
</main>
<script>
const $=id=>document.getElementById(id);let bosses=[],lastGood=0;
const formatTime=iso=>{if(!iso)return '-';let d=new Date(iso);return Number.isNaN(d.getTime())?'-':new Intl.DateTimeFormat('ko-KR',{timeZone:'Asia/Seoul',hour:'2-digit',minute:'2-digit',hour12:false,month:'2-digit',day:'2-digit'}).format(d)};
function getState(b){const s=String(b.status||'').trim().toLowerCase();if(['alive','spawned','up','active','live','appeared','출현','출현중'].includes(s))return 'live';if(['waiting','pending','not_spawned','대기','대기중'].includes(s))return 'waiting';return 'other'}
function statusLabel(b){const s=String(b.status||'').trim(),t=getState(b);return t==='live'?'출현 중':t==='waiting'?'대기 중':({'killed':'처치됨','dead':'처치됨','down':'처치됨'}[s.toLowerCase()]||s||'상태 미확인')}
function countdown(iso){if(!iso)return '시간 정보 없음';const ms=new Date(iso).getTime()-Date.now();if(!Number.isFinite(ms))return '시간 정보 없음';if(ms<=0)return '예정 시간 경과';const sec=Math.floor(ms/1000),h=Math.floor(sec/3600),m=Math.floor((sec%3600)/60),s=sec%60;return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`}
function el(tag,cls,txt){const n=document.createElement(tag);if(cls)n.className=cls;if(txt!==undefined)n.textContent=txt;return n}
function render(){
 const subset=bosses.filter(b=>String(b.name||'').toLowerCase().includes($('search').value.trim().toLowerCase())).filter(b=>{const f=$('filter').value;return f==='all'||(f==='other'?getState(b)==='other':getState(b)===f)});
 const order=$('sort').value;
 const nextVal=b=>{const t=Date.parse(b.next_spawn_at);return Number.isFinite(t)?t:Infinity};
 subset.sort((a,b)=>order==='name'?a.name.localeCompare(b.name,'ko'):order==='status'?(getState(a)==='live'?0:1)-(getState(b)==='live'?0:1)||nextVal(a)-nextVal(b):(nextVal(a)-nextVal(b))||a.name.localeCompare(b.name,'ko'));
 const target=$('bosses');target.replaceChildren();if(!subset.length){target.append(el('div','empty',bosses.length?'검색 결과가 없습니다.':'현재 표시할 보스 정보가 없습니다.'));return}
 for(const b of subset){
  const state=getState(b),card=el('article','boss'+(state==='live'?' live-row':''));
  const name=el('div','boss-name');name.append(el('h2','',b.name),el('small','',b.category||''));
  const chip=el('span','chip '+(state==='live'?'live':state==='waiting'?'wait':'dead'),statusLabel(b));
  const time=el('div','timer'+(state==='live'?' active':''),state==='live'?'출현 중':countdown(b.next_spawn_at));
  if(state!=='live')time.dataset.next=b.next_spawn_at||'';
  const next=el('span','next-time',formatTime(b.next_spawn_at));
  const cycle=el('span','cycle',b.interval_minutes?`${b.interval_minutes}분`:'—');
  card.append(name,chip,time,next,cycle);target.append(card);
 }
}
function tick(){document.querySelectorAll('[data-next]').forEach(node=>{node.textContent=countdown(node.dataset.next)})}
async function load(){try{const response=await fetch('/api/bosses',{cache:'no-store'});const data=await response.json();if(!response.ok||!Array.isArray(data.bosses))throw new Error(data.detail||data.error||'잘못된 응답');bosses=data.bosses;lastGood=Date.now();$('total').textContent=bosses.length;$('liveCount').textContent=bosses.filter(b=>getState(b)==='live').length;$('waitingCount').textContent=bosses.filter(b=>getState(b)!=='live').length;$('dot').className='dot ok';$('connection').textContent='데이터 연결됨';$('updated').textContent='최근 확인: '+new Date().toLocaleTimeString('ko-KR',{timeZone:'Asia/Seoul'});$('error').hidden=true;render()}catch(e){$('dot').className='dot bad';$('connection').textContent='연결 오류'+(lastGood?' · 마지막 데이터 표시 중':'');$('error').hidden=false;$('error').textContent='원본 서버 데이터에 연결할 수 없습니다: '+e.message+(lastGood?' (마지막으로 받은 데이터를 표시합니다)':'');if(!lastGood)$('bosses').replaceChildren(el('div','empty','보스 정보를 불러오지 못했습니다. 잠시 후 다시 시도하세요.'))}}
$('reload').addEventListener('click',load);['search','filter','sort'].forEach(id=>$(id).addEventListener(id==='search'?'input':'change',render));setInterval(load,15000);setInterval(tick,1000);load();
</script>
</body></html>
